
name: Car Price Prediction ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train car price model
        run: python train_model.py

      - name: Check model metrics
        run: |
          python -c "import json; m=json.load(open('metrics.json')); print(m); assert m['mae'] >= 0; assert -1 <= m['r2_score'] <= 1"

      - name: Test ML pipeline
        run: python -m unittest test_ml_pipeline.py -v

      - name: Test Flask API
        run: python -m unittest test_app.py -v

      - name: Package release candidate
        run: |
          mkdir release-candidate
          cp app.py train_model.py requirements.txt metrics.json car_price_model.pkl release-candidate/
          cp DEPLOYMENT.txt release-candidate/

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: car-price-prediction-release
          path: release-candidate/
          if-no-files-found: error
